name: Github Python Test Demo
on: [push, pull]
jobs:
  Run-Python-Tests:
    runs-on: ubuntu-latest
    steps:
      - name: Install pytest
        uses: actions/checkout@v6
      - run:  python -m pip install -r requirements.txt
      - name: Check environment
        run:  bash scripts/check-env.sh
      - name: Check python version
        run:  python --version
      - name: Run Tests
        run:  pytest